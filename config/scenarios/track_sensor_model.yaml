schema_version: 3
scenario_id: track_obstacle_with_sensor_model
seed: 17421
source: {pointcloud_topic: /lidar_points}
frames: {start_index: 0, end_index: 4}
zero_slot_recovery:
  enabled: true
  ring_field: ring
  timestamp_field: timestamp
  timestamp_unit: microseconds
  min_valid_samples_per_ring: 8
  interpolation: linear
  allow_extrapolation: false
  max_angular_error_deg: 0.25
sensor_effects:
  no_return_encoding: zero_xyz
  range_noise: {enabled: true, model: gaussian, base_sigma_m: 0.008, sigma_per_meter: 0.0002, incidence_sigma_scale: 0.01, min_range_m: 0.2, max_resample_attempts: 8}
  dropout: {enabled: true, base_return_probability: 0.96, distance_reference_m: 30.0, distance_exponent: 1.0, incidence_exponent: 1.5, min_return_probability: 0.05}
  intensity: {enabled: true, model: empirical, field_name: intensity, range_bin_m: 5.0, min_samples_per_bin: 32, incidence_exponent: 1.0, additive_sigma: 1.5, fallback: preserve_original, on_missing: error}
track:
  reference_frame: map
  model:
    type: polyline
    points_m: [[0.0, 0.0, 0.0], [20.0, 0.0, 0.0], [40.0, 2.0, 0.2], [60.0, 5.0, 0.5]]
  up_hint: [0.0, 0.0, 1.0]
ego_motion:
  source: trajectory_csv
  path: ../../trajectories/synthetic_run.csv
  reference_frame: map
  lidar_frame: synthetic_lidar
  timestamp_unit: nanoseconds
  max_interpolation_gap_ms: 100
visualization: {enabled: true, marker_topic: /synthetic/markers, point_size_m: 0.06, marker_lifetime_sec: 0.25}
objects:
  - id: obstacle_track_1
    class_name: obstacle
    geometry: {type: box, dimensions_m: [0.6, 0.4, 0.3]}
    placement: {type: track_relative, longitudinal_m: 12.0, lateral_m: 0.7, height_m: 0.15, rpy_track_deg: [0.0, 0.0, 10.0]}
    temporal:
      active_frames: {start_index: 0, end_index: 4}
      motion: {type: static}
    material: {reflectivity: 0.45, return_probability_scale: 0.9}
    visualization: {color_rgba: [1.0, 0.2, 0.1, 0.9]}
