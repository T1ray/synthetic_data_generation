# Paired with range_eval_reference_10_25_50: identical seed, frames, objects, poses; only sensor effects differ.
# Target bag: roundT_doubleT. XYZ is in hesai_lidar; forward is approximately -Y.
# These are per-scan placements, not a world-fixed approaching obstacle.
schema_version: 3
scenario_id: range_eval_noise_dropout_pair
seed: 17421
source: {pointcloud_topic: /lidar_points}
frames: {start_index: 0, end_index: 59}
zero_slot_recovery:
  enabled: false
  ring_field: ring
  timestamp_field: timestamp
  timestamp_unit: seconds
  min_valid_samples_per_ring: 8
  interpolation: linear
  allow_extrapolation: false
  max_angular_error_deg: 0.25
sensor_effects:
  no_return_encoding: zero_xyz
  range_noise:
    enabled: true
    model: gaussian
    base_sigma_m: 0.04
    sigma_per_meter: 0.001
    incidence_sigma_scale: 0.01
    min_range_m: 0.2
    max_resample_attempts: 8
  dropout:
    enabled: true
    base_return_probability: 0.75
    distance_reference_m: 15.0
    distance_exponent: 0.7
    incidence_exponent: 0.5
    min_return_probability: 0.15
  intensity:
    enabled: false
    model: empirical
    field_name: intensity
    range_bin_m: 5.0
    min_samples_per_bin: 8
    incidence_exponent: 1.0
    additive_sigma: 0.0
    fallback: preserve_original
    constant: 50.0
    on_missing: error
visualization:
  enabled: true
  marker_topic: /synthetic/markers
  marker_mode: frame
  point_size_m: 0.10
  marker_lifetime_sec: 600.0
  show_geometry: true
  show_modified_points: true
  show_text: true
  show_bounding_box: true
objects:
  - id: reference_10m
    class_name: obstacle
    geometry: {type: box, dimensions_m: [2.0, 2.0, 2.5]}
    placement: {type: lidar_relative, xyz_m: [0, -10, -2], rpy_deg: [0, 0, 0]}
    temporal:
      active_frames: {start_index: 0, end_index: 19}
      motion: {type: static}
    material: {reflectivity: 0.7, return_probability_scale: 1.0}
    visualization: {color_rgba: [1.0, 0.45, 0.05, 1.0]}
  - id: reference_25m
    class_name: obstacle
    geometry: {type: box, dimensions_m: [2.0, 2.0, 2.5]}
    placement: {type: lidar_relative, xyz_m: [0, -25, -2], rpy_deg: [0, 0, 0]}
    temporal:
      active_frames: {start_index: 20, end_index: 39}
      motion: {type: static}
    material: {reflectivity: 0.7, return_probability_scale: 1.0}
    visualization: {color_rgba: [1.0, 0.45, 0.05, 1.0]}
  - id: reference_50m
    class_name: obstacle
    geometry: {type: box, dimensions_m: [2.0, 2.0, 2.5]}
    placement: {type: lidar_relative, xyz_m: [0, -50, -2], rpy_deg: [0, 0, 0]}
    temporal:
      active_frames: {start_index: 40, end_index: 59}
      motion: {type: static}
    material: {reflectivity: 0.7, return_probability_scale: 1.0}
    visualization: {color_rgba: [1.0, 0.45, 0.05, 1.0]}
