# One geometry at a time. Equal distance ladder for person and cable; far bins require visibility checks.
# Target bag: roundT_doubleT. XYZ is in hesai_lidar; forward is approximately -Y.
# These are per-scan placements, not a world-fixed approaching obstacle.
schema_version: 3
scenario_id: range_eval_person_and_cable
seed: 17421
source: {pointcloud_topic: /lidar_points}
frames: {start_index: 160, end_index: 239}
zero_slot_recovery:
  enabled: false
  ring_field: ring
  timestamp_field: timestamp
  timestamp_unit: seconds
  min_valid_samples_per_ring: 8
  interpolation: linear
  allow_extrapolation: false
  max_angular_error_deg: 0.25
sensor_effects:
  no_return_encoding: zero_xyz
  range_noise:
    enabled: false
    model: gaussian
    base_sigma_m: 0.0
    sigma_per_meter: 0.0
    incidence_sigma_scale: 0.0
    min_range_m: 0.2
    max_resample_attempts: 8
  dropout:
    enabled: false
    base_return_probability: 1.0
    distance_reference_m: 15.0
    distance_exponent: 0.0
    incidence_exponent: 0.0
    min_return_probability: 1.0
  intensity:
    enabled: false
    model: empirical
    field_name: intensity
    range_bin_m: 5.0
    min_samples_per_bin: 8
    incidence_exponent: 1.0
    additive_sigma: 0.0
    fallback: preserve_original
    constant: 50.0
    on_missing: error
visualization:
  enabled: true
  marker_topic: /synthetic/markers
  marker_mode: frame
  point_size_m: 0.10
  marker_lifetime_sec: 600.0
  show_geometry: true
  show_modified_points: true
  show_text: true
  show_bounding_box: true
objects:
  - id: person_100m
    class_name: person
    geometry:
      type: human_mesh
      path: ../../meshes/humans/low_poly_person.obj
      units: meters
      scale: [1.0, 1.0, 1.0]
      origin: base_center
    placement: {type: lidar_relative, xyz_m: [0, -100, -1], rpy_deg: [0, 0, 0]}
    temporal:
      active_frames: {start_index: 200, end_index: 209}
      motion: {type: static}
    material: {reflectivity: 0.7, return_probability_scale: 1.0}
    visualization: {color_rgba: [1.0, 0.45, 0.05, 1.0]}
